<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            background-color: #B9FFFE;
            color: #000000;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            border: 5px solid royalblue;
            padding: auto;
        }
        main{
            background-color: black;
            color: aliceblue;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            p.autor{
                font-weight: bold;
            }
        }
        img{
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Site do 1A</h1>
        <p>Aprenda a fazer um site</p>  
    </header>
    <main>
        <img src="imagem.png" alt="Aula de Educação digital ">
        <div>
             <h2>Educação digital</h2>
             <p class="autor">Areadine</p>
             <p>Exercicio da aula de Educação digital</p>
             <button><span>0</span></button>
        </div>
<p>Este site e para a aula de educacao digital 1A</p>
<img src="imagem.png" alt=" Imagem de Aula de Educação Digital">
    </main>
</body>
<script>
    const botao = document.querySelector ( "button");
    botao.addEventListener("click", botaoClicando);
    function botaoClicado() {
        let texto = botao.querySelector("span");
        texto.textContent++;
        }
</script>
</html>
